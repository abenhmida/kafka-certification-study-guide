name: Deploy Kafka Certification Book

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 0.5.4

      - name: Cache mdbook-mermaid binary
        id: cache-mermaid
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook-mermaid
          key: mdbook-mermaid-v0.17.0
      
      - name: Install Mermaid preprocessor
        if: steps.cache-mermaid.outputs.cache-hit != 'true'
        run: |
          cargo install mdbook-mermaid --locked --version 0.17.0

      - name: Install Mermaid preprocessor for mdbook
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mdbook-mermaid install src

      - name: Build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
